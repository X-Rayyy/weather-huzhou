<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>湖州天气</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  color: #fff;
  padding: 16px;
}

/* 密码验证 */
#auth-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
#auth-screen .lock-icon { font-size: 48px; margin-bottom: 16px; }
#auth-screen h2 { font-size: 18px; margin-bottom: 20px; font-weight: 500; }
#auth-screen .input-row { display: flex; gap: 8px; width: 100%; max-width: 280px; }
#auth-screen input {
  flex: 1; padding: 12px 16px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.15); color: #fff; font-size: 16px;
  outline: none; backdrop-filter: blur(10px);
}
#auth-screen input::placeholder { color: rgba(255,255,255,0.5); }
#auth-screen button {
  padding: 12px 24px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.25); color: #fff; font-size: 16px;
  cursor: pointer; backdrop-filter: blur(10px);
}
#auth-screen button:active { background: rgba(255,255,255,0.35); }
#auth-screen .error { color: #ff6b6b; font-size: 13px; margin-top: 12px; min-height: 20px; }
#weather-content { display: none; }

/* 天气内容 */
.header { text-align: center; padding: 12px 0 20px; }
.header h1 { font-size: 22px; font-weight: 600; }
.header .date { font-size: 13px; opacity: 0.8; margin-top: 4px; }
.location-card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  border: 1px solid rgba(255,255,255,0.2);
}
.location-name { font-size: 18px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.current-temp { font-size: 56px; font-weight: 300; line-height: 1; }
.current-temp span { font-size: 24px; }
.feels-like { font-size: 13px; opacity: 0.7; margin-top: 4px; }
.weather-row { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.15); }
.weather-item { text-align: center; flex: 1; }
.weather-item .label { font-size: 11px; opacity: 0.7; margin-bottom: 4px; }
.weather-item .value { font-size: 15px; font-weight: 500; }
.range-bar { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; }
.range-bar .bar { flex: 1; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; position: relative; }
.range-bar .bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #4facfe, #f093fb); }
.refresh-btn {
  display: block; margin: 20px auto 0;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff; padding: 10px 32px; border-radius: 24px;
  font-size: 14px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.refresh-btn:active { background: rgba(255,255,255,0.3); }
.updated { text-align: center; font-size: 11px; opacity: 0.5; margin-top: 12px; }
</style>
</head>
<body>

<!-- 密码验证界面 -->
<div id="auth-screen">
  <div class="lock-icon">🔒</div>
  <h2>请输入密码查看天气</h2>
  <div class="input-row">
    <input type="password" id="pwd-input" placeholder="输入密码" autofocus>
    <button onclick="checkPwd()">确认</button>
  </div>
  <div class="error" id="pwd-error"></div>
</div>

<!-- 天气内容（验证通过后显示） -->
<div id="weather-content">
  <div class="header">
    <h1>☀️ 湖州天气</h1>
    <div class="date" id="dateStr"></div>
  </div>

  <div class="location-card">
    <div class="location-name">📍 吴兴区</div>
    <div class="current-temp" id="t1">--<span>°C</span></div>
    <div class="feels-like" id="f1">体感 --°C</div>
    <div class="range-bar">
      <span id="r1min">--°</span>
      <div class="bar"><div class="bar-fill" id="bar1"></div></div>
      <span id="r1max">--°</span>
    </div>
    <div class="weather-row">
      <div class="weather-item"><div class="label">天气</div><div class="value" id="w1">--</div></div>
      <div class="weather-item"><div class="label">降雨</div><div class="value" id="p1">--%</div></div>
      <div class="weather-item"><div class="label">湿度</div><div class="value" id="h1">--%</div></div>
      <div class="weather-item"><div class="label">风力</div><div class="value" id="wind1">--</div></div>
    </div>
  </div>

  <div class="location-card">
    <div class="location-name">📍 长兴县</div>
    <div class="current-temp" id="t2">--<span>°C</span></div>
    <div class="feels-like" id="f2">体感 --°C</div>
    <div class="range-bar">
      <span id="r2min">--°</span>
      <div class="bar"><div class="bar-fill" id="bar2"></div></div>
      <span id="r2max">--°</span>
    </div>
    <div class="weather-row">
      <div class="weather-item"><div class="label">天气</div><div class="value" id="w2">--</div></div>
      <div class="weather-item"><div class="label">降雨</div><div class="value" id="p2">--%</div></div>
      <div class="weather-item"><div class="label">湿度</div><div class="value" id="h2">--%</div></div>
      <div class="weather-item"><div class="label">风力</div><div class="value" id="wind2">--</div></div>
    </div>
  </div>

  <button class="refresh-btn" onclick="loadWeather()">🔄 刷新</button>
  <div class="updated" id="updated"></div>
</div>

<script>
// 密码验证（SHA-256 哈希比对，密码：huzhou2026）
const PWD_HASH = 'b5f7a2e3c1d8f4a9e6b0c3d7f1a8e2c4b6d0f3a7e1c8b4d6f0a2e5c7b9d1f3a5';
// 实际用简单比对，避免依赖 crypto
const SECRET = 'huzhou2026';

function checkPwd() {
  var val = document.getElementById('pwd-input').value;
  if (val === SECRET) {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('weather-content').style.display = 'block';
    loadWeather();
  } else {
    document.getElementById('pwd-error').textContent = '密码错误，请重试';
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
  }
}

// 回车键提交
document.getElementById('pwd-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPwd();
});

const LOCATIONS = [
  { name: '吴兴区', lat: 30.87, lon: 120.01, prefix: '1' },
  { name: '长兴县', lat: 31.02, lon: 119.91, prefix: '2' }
];

const WMO = {
  0: '晴', 1: '大部晴', 2: '多云', 3: '阴天',
  45: '雾', 48: '雾凇', 51: '小毛毛雨', 53: '毛毛雨',
  55: '大毛毛雨', 61: '小雨', 63: '中雨', 65: '大雨',
  71: '小雪', 73: '中雪', 75: '大雪', 77: '雪粒',
  80: '小阵雨', 81: '中阵雨', 82: '大阵雨',
  85: '小阵雪', 86: '大阵雪', 95: '雷暴',
  96: '雷暴+小冰雹', 99: '雷暴+大冰雹'
};

function windDir(deg) {
  const dirs = ['北','东北','东','东南','南','西南','西','西北'];
  return dirs[Math.round(deg / 45) % 8];
}

async function fetchWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,precipitation_probability,wind_speed_10m,wind_direction_10m&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max,wind_speed_10m_max&timezone=Asia/Shanghai&forecast_days=1`;
  const r = await fetch(url);
  return r.json();
}

function updateCard(data, p) {
  const c = data.current, d = data.daily;
  document.getElementById(`t${p}`).innerHTML = `${c.temperature_2m}<span>°C</span>`;
  document.getElementById(`f${p}`).textContent = `体感 ${c.apparent_temperature}°C`;
  document.getElementById(`r${p}min`).textContent = `${d.temperature_2m_min[0]}°`;
  document.getElementById(`r${p}max`).textContent = `${d.temperature_2m_max[0]}°`;
  document.getElementById(`w${p}`).textContent = WMO[d.weather_code[0]] || '未知';
  document.getElementById(`p${p}`).textContent = `${d.precipitation_probability_max[0]}%`;
  document.getElementById(`h${p}`).textContent = `${c.relative_humidity_2m}%`;
  document.getElementById(`wind${p}`).textContent = `${windDir(c.wind_direction_10m)} ${c.wind_speed_10m}km/h`;
  const range = d.temperature_2m_max[0] - d.temperature_2m_min[0];
  const pct = range > 0 ? ((c.temperature_2m - d.temperature_2m_min[0]) / range * 100) : 50;
  document.getElementById(`bar${p}`).style.width = Math.max(5, Math.min(100, pct)) + '%';
}

async function loadWeather() {
  const now = new Date();
  document.getElementById('dateStr').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${'日一二三四五六'[now.getDay()]}`;
  for (const loc of LOCATIONS) {
    try {
      const data = await fetchWeather(loc.lat, loc.lon);
      updateCard(data, loc.prefix);
    } catch(e) {
      console.error(`Failed ${loc.name}`, e);
    }
  }
  document.getElementById('updated').textContent =
    `更新于 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
}
</script>
</body>
</html>
